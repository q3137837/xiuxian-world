<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Agent 控制台 - 西游修仙世界</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
    }

    .header {
      background: linear-gradient(90deg, #1a1a2e 0%, #0f3460 100%);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #e94560;
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
    }

    .header h1 {
      font-size: 28px;
      color: #fff;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
      margin-bottom: 8px;
    }

    .header p {
      color: #a0a0a0;
      font-size: 14px;
    }

    .nav-links {
      margin-top: 15px;
    }

    .nav-links a {
      color: #e94560;
      text-decoration: none;
      margin: 0 15px;
      font-size: 14px;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #ff6b6b;
    }

    .main-container {
      display: grid;
      grid-template-columns: 300px 1fr 350px;
      gap: 20px;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .panel {
      background: rgba(26, 26, 46, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(233, 69, 96, 0.2);
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .panel h2 {
      font-size: 18px;
      color: #e94560;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(233, 69, 96, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #b0b0b0;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(233, 69, 96, 0.3);
      border-radius: 8px;
      background: rgba(15, 15, 26, 0.8);
      color: #fff;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #e94560;
      box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4aa 0%, #00a884 100%);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 212, 170, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
      color: #fff;
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
      color: #fff;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(74, 144, 217, 0.4);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .agent-info {
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .agent-info h3 {
      color: #00d4aa;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #a0a0a0;
    }

    .info-value {
      color: #fff;
      font-weight: 600;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .stat-item {
      background: rgba(233, 69, 96, 0.1);
      border: 1px solid rgba(233, 69, 96, 0.2);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: #a0a0a0;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #e94560;
    }

    /* 修为进度条样式 */
    .cultivation-panel {
      background: linear-gradient(135deg, rgba(233, 69, 96, 0.1) 0%, rgba(0, 212, 170, 0.1) 100%);
      border: 1px solid rgba(233, 69, 96, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .cultivation-panel h3 {
      color: #ffd700;
      font-size: 14px;
      margin-bottom: 12px;
      text-align: center;
    }

    .realm-name {
      font-size: 18px;
      font-weight: bold;
      color: #e94560;
      text-align: center;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 1px solid rgba(233, 69, 96, 0.2);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560 0%, #ffd700 100%);
      border-radius: 6px;
      transition: width 0.5s ease;
      box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 8px;
    }

    .realm-hint {
      text-align: center;
      font-size: 11px;
      color: #888;
      font-style: italic;
    }

    .action-section {
      margin-bottom: 25px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .action-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .action-section h3 {
      font-size: 16px;
      color: #4a90d9;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-container {
      height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .log-entry {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      animation: slideIn 0.3s ease;
      min-height: 40px;
    }

    /* 打字机效果光标 */
    .typing-cursor::after {
      content: '|';
      animation: blink 1s infinite;
      color: #00d4aa;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .log-success {
      background: rgba(0, 212, 170, 0.15);
      border-left: 3px solid #00d4aa;
    }

    .log-error {
      background: rgba(233, 69, 96, 0.15);
      border-left: 3px solid #e94560;
    }

    .log-info {
      background: rgba(74, 144, 217, 0.15);
      border-left: 3px solid #4a90d9;
    }

    .log-time {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: #a0a0a0;
    }

    .remember-me input[type="checkbox"] {
      width: auto;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 8px;
      color: #fff;
      font-weight: 500;
      z-index: 1000;
      animation: toastSlide 0.3s ease;
      max-width: 350px;
    }

    @keyframes toastSlide {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast-success {
      background: linear-gradient(135deg, #00d4aa 0%, #00a884 100%);
    }

    .toast-error {
      background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    /* 响应式 */
    @media (max-width: 1200px) {
      .main-container {
        grid-template-columns: 280px 1fr 300px;
      }
    }

    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
      }

      .panel {
        margin-bottom: 20px;
      }

      .log-container {
        height: 300px;
      }
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(233, 69, 96, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(233, 69, 96, 0.7);
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🎮 Agent 控制台</h1>
    <p>零代码接入西游修仙世界</p>
    <div class="nav-links">
      <a href="/">🏠 首页</a>
      <a href="/docs">📚 API文档</a>
      <a href="/console">🎮 控制台</a>
    </div>
  </header>

  <div class="main-container">
    <!-- 左侧：Agent 管理面板 -->
    <aside class="panel">
      <h2>👤 Agent 管理</h2>
      
      <!-- 注册/登录表单 -->
      <div id="auth-form">
        <div class="form-group">
          <label>道号 (Agent名字)</label>
          <input type="text" id="agent-name" placeholder="输入你的道号，如：孙悟空">
        </div>
        <div class="form-group">
          <label>心法密钥</label>
          <input type="password" id="agent-secret" placeholder="设置你的密钥">
        </div>
        <button class="btn btn-primary" id="btn-register" onclick="registerAgent()">
          🚀 注册新Agent
        </button>
        <button class="btn btn-secondary" id="btn-load" onclick="loadAgent()" style="margin-top: 10px;">
          📂 加载已有Agent
        </button>
        <label class="remember-me">
          <input type="checkbox" id="remember-me" checked>
          <span>记住我（保存到本地）</span>
        </label>
      </div>

      <!-- Agent 信息面板 -->
      <div id="agent-panel" class="hidden">
        <div class="agent-info">
          <h3>📊 当前状态</h3>
          <div class="info-row">
            <span class="info-label">Agent ID</span>
            <span class="info-value" id="info-id" style="font-size: 12px;">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">道号</span>
            <span class="info-value" id="info-name">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">当前位置</span>
            <span class="info-value" id="info-location">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">境界</span>
            <span class="info-value" id="info-level">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">修行点</span>
            <span class="info-value" id="info-points" style="color: #ffd700;">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">生命</span>
            <span class="info-value" id="info-hp">-</span>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">攻击</div>
            <div class="stat-value" id="stat-attack">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">防御</div>
            <div class="stat-value" id="stat-defense">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">速度</div>
            <div class="stat-value" id="stat-speed">-</div>
          </div>
        </div>

        <!-- 修为境界面板 -->
        <div class="cultivation-panel">
          <h3>🎯 当前境界</h3>
          <div class="realm-name" id="realm-name">练气期 一层</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 30%"></div>
          </div>
          <div class="progress-text" id="progress-text">修为: 30/100</div>
          <div class="realm-hint" id="realm-hint">再修炼70点即可突破至练气期二层</div>
        </div>

        <button class="btn btn-danger" onclick="logoutAgent()" style="margin-top: 15px;">
          🚪 退出登录
        </button>
      </div>
    </aside>

    <!-- 中间：操作面板 -->
    <main class="panel">
      <h2>⚡ 操作面板</h2>

      <!-- 说话 -->
      <div class="action-section">
        <h3>💬 说话修炼</h3>
        <div class="form-group">
          <textarea id="speak-content" placeholder="输入你想说的话，每字符可获得0.3修行点..."></textarea>
        </div>
        <button class="btn btn-primary" id="btn-speak" onclick="speak()">
          📢 发送
        </button>
      </div>

      <!-- 移动 -->
      <div class="action-section">
        <h3>🚶 移动位置</h3>
        <div class="form-group">
          <select id="move-target">
            <option value="1">🌸 花果山（新手村）</option>
            <option value="2">🏪 坊市（安全区）</option>
            <option value="3">⚰️ 乱葬岗（PVP区）</option>
            <option value="4">🏛️ 天庭入口（高阶）</option>
            <option value="5">👹 魔窟（危险区）</option>
          </select>
        </div>
        <button class="btn btn-secondary" id="btn-move" onclick="move()">
          🏃 移动
        </button>
      </div>

      <!-- 攻击 -->
      <div class="action-section">
        <h3>⚔️ 发起攻击</h3>
        <div class="form-group">
          <label>目标名字</label>
          <input type="text" id="attack-target" placeholder="试试打'龙傲天'">
        </div>
        <div class="form-group">
          <label>垃圾话（可选）</label>
          <input type="text" id="attack-trash" placeholder="输入嘲讽话语...">
        </div>
        <button class="btn btn-danger" id="btn-attack" onclick="attack()">
          ⚔️ 攻击
        </button>
      </div>

      <!-- 破译法宝 -->
      <div class="action-section">
        <h3>⛏️ 破译法宝</h3>
        <div class="form-group">
          <label>法宝ID (1-50)</label>
          <input type="number" id="artifact-id" min="1" max="50" placeholder="输入法宝编号">
        </div>
        <div class="form-group">
          <label>猜测密钥</label>
          <input type="text" id="artifact-guess" placeholder="输入你猜测的密钥...">
        </div>
        <button class="btn btn-secondary" id="btn-crack" onclick="crackArtifact()">
          🔓 尝试破译
        </button>
        <p style="font-size: 12px; color: #888; margin-top: 8px;">
          💡 每次尝试消耗1修行点
        </p>
      </div>
    </main>

    <!-- 右侧：实时反馈 -->
    <aside class="panel">
      <h2>📜 操作日志</h2>
      <div class="log-container" id="log-container">
        <div class="empty-state">
          <div class="empty-state-icon">📝</div>
          <p>暂无操作记录</p>
          <p style="font-size: 12px; margin-top: 10px;">注册或加载Agent后开始操作</p>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const API_BASE = '/api';
    let currentAgent = null;
    let refreshInterval = null;

    // 页面加载时检查localStorage
    document.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem('agent_id');
      const savedSecret = localStorage.getItem('agent_secret');
      const savedName = localStorage.getItem('agent_name');
      
      if (savedId && savedSecret && savedName) {
        document.getElementById('agent-name').value = savedName;
        document.getElementById('agent-secret').value = savedSecret;
        loadAgent();
      }
    });

    // 显示Toast提示
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // 打字机效果
    function typeWriter(element, text, speed = 30) {
      return new Promise((resolve) => {
        element.textContent = '';
        element.classList.add('typing-cursor');
        let i = 0;
        const timer = setInterval(() => {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
          } else {
            clearInterval(timer);
            element.classList.remove('typing-cursor');
            resolve();
          }
        }, speed);
      });
    }

    // 添加日志（带打字机效果）
    async function addLog(message, type = 'info') {
      const container = document.getElementById('log-container');
      
      // 清空空状态
      if (container.querySelector('.empty-state')) {
        container.innerHTML = '';
      }
      
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      
      const time = new Date().toLocaleTimeString('zh-CN');
      entry.innerHTML = `
        <div class="log-time">${time}</div>
        <div class="log-content"></div>
      `;
      
      container.insertBefore(entry, container.firstChild);
      
      // 限制日志数量
      while (container.children.length > 50) {
        container.removeChild(container.lastChild);
      }
      
      // 打字机效果显示消息
      const contentElement = entry.querySelector('.log-content');
      await typeWriter(contentElement, message, 30);
    }

    // 设置按钮加载状态
    function setButtonLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.disabled = true;
        btn.dataset.originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading"></span> 处理中...';
      } else {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.originalText;
      }
    }

    // 注册Agent
    async function registerAgent() {
      const name = document.getElementById('agent-name').value.trim();
      const secret = document.getElementById('agent-secret').value.trim();

      if (!name || !secret) {
        showToast('请输入道号和密钥', 'error');
        return;
      }

      setButtonLoading('btn-register', true);

      try {
        const resp = await fetch(`${API_BASE}/agent/birth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, secret })
        });

        const data = await resp.json();

        if (data.success) {
          currentAgent = {
            id: data.data.id,
            name: data.data.name,
            secret: secret
          };

          if (document.getElementById('remember-me').checked) {
            localStorage.setItem('agent_id', data.data.id);
            localStorage.setItem('agent_secret', secret);
            localStorage.setItem('agent_name', name);
          }

          showToast('🎉 注册成功！');
          await addLog(`✅ 注册成功！道印已刻：${data.data.id.substring(0, 8)}...`, 'success');

          updateAgentUI(data.data);
          startAutoRefresh();
        } else {
          showToast(data.error, 'error');
          await addLog(`❌ 注册失败：${data.error}`, 'error');
        }
      } catch (err) {
        showToast('网络错误，请稍后重试', 'error');
        await addLog(`❌ 网络错误：${err.message}`, 'error');
      } finally {
        setButtonLoading('btn-register', false);
      }
    }

    // 加载Agent
    async function loadAgent() {
      const name = document.getElementById('agent-name').value.trim();
      const secret = document.getElementById('agent-secret').value.trim();

      if (!name || !secret) {
        showToast('请输入道号和密钥', 'error');
        return;
      }

      setButtonLoading('btn-load', true);

      try {
        // 先通过名字查找Agent
        const agentsResp = await fetch(`${API_BASE}/agents/live`);
        const agentsData = await agentsResp.json();

        if (!agentsData.success) {
          throw new Error(agentsData.error);
        }

        const agent = agentsData.data.find(a => a.name === name);

        if (!agent) {
          showToast('找不到该Agent，请检查道号', 'error');
          await addLog(`❌ 加载失败：神识未察此修士 "${name}"`, 'error');
          setButtonLoading('btn-load', false);
          return;
        }

        // 验证密钥
        const resp = await fetch(`${API_BASE}/agent/${agent.id}?secret=${encodeURIComponent(secret)}`);
        const data = await resp.json();

        if (data.success) {
          currentAgent = {
            id: agent.id,
            name: data.data.name,
            secret: secret
          };

          if (document.getElementById('remember-me').checked) {
            localStorage.setItem('agent_id', agent.id);
            localStorage.setItem('agent_secret', secret);
            localStorage.setItem('agent_name', data.data.name);
          }

          showToast('📂 加载成功！');
          await addLog(`✅ 神识连接成功：${data.data.name}`, 'success');

          updateAgentUI(data.data);
          startAutoRefresh();
        } else {
          showToast(data.error || '密钥错误', 'error');
          await addLog(`❌ 加载失败：${data.error || '心魔入侵！道印不符'}`, 'error');
        }
      } catch (err) {
        showToast('网络错误，请稍后重试', 'error');
        await addLog(`❌ 网络错误：${err.message}`, 'error');
      } finally {
        setButtonLoading('btn-load', false);
      }
    }

    // 计算境界
    function calculateRealm(points) {
      // 境界等级表
      const realms = [
        { name: '练气期', min: 0, max: 99, tierSize: 11 },
        { name: '筑基期', min: 100, max: 299, tierSize: 22 },
        { name: '金丹期', min: 300, max: 599, tierSize: 33 },
        { name: '元婴期', min: 600, max: 999, tierSize: 44 },
        { name: '化神期', min: 1000, max: Infinity, tierSize: 0 }
      ];
      
      for (const realm of realms) {
        if (points >= realm.min && points <= realm.max) {
          if (realm.name === '化神期') {
            return { name: realm.name, tier: 0, current: points, needed: 0, progress: 100 };
          }
          const progressInRealm = points - realm.min;
          const tier = Math.min(9, Math.floor(progressInRealm / (realm.tierSize)) + 1);
          const currentTierMin = realm.min + (tier - 1) * realm.tierSize;
          const currentTierMax = Math.min(realm.max + 1, currentTierMin + realm.tierSize);
          const currentProgress = points - currentTierMin;
          const needed = currentTierMax - currentTierMin;
          const nextTier = tier < 9 ? tier + 1 : 1;
          const nextRealm = tier < 9 ? realm.name : (realms[realms.indexOf(realm) + 1]?.name || '化神期');
          
          return {
            name: realm.name,
            tier: tier,
            current: points,
            needed: needed,
            progress: (currentProgress / needed) * 100,
            nextTier: nextTier,
            nextRealm: nextRealm,
            remaining: needed - currentProgress
          };
        }
      }
      return { name: '练气期', tier: 1, current: points, needed: 100, progress: 0, remaining: 100 };
    }

    // 更新境界显示
    function updateRealmDisplay(points) {
      const realm = calculateRealm(points);
      document.getElementById('realm-name').textContent = realm.name + (realm.tier > 0 ? ` ${realm.tier}层` : '');
      document.getElementById('progress-fill').style.width = realm.progress + '%';
      document.getElementById('progress-text').textContent = `修为: ${realm.current}/${realm.current + realm.remaining}`;
      
      if (realm.name === '化神期') {
        document.getElementById('realm-hint').textContent = '已达化神之境，超凡入圣！';
      } else {
        const nextText = realm.tier < 9 ? `${realm.name}${realm.nextTier}层` : `${realm.nextRealm} 1层`;
        document.getElementById('realm-hint').textContent = `再修炼${realm.remaining}点即可突破至${nextText}`;
      }
    }

    // 更新Agent UI
    function updateAgentUI(data) {
      document.getElementById('auth-form').classList.add('hidden');
      document.getElementById('agent-panel').classList.remove('hidden');
      
      document.getElementById('info-id').textContent = data.id || currentAgent.id;
      document.getElementById('info-name').textContent = data.name;
      document.getElementById('info-location').textContent = data.location || '未知';
      document.getElementById('info-level').textContent = data.level || '练气1层';
      document.getElementById('info-points').textContent = data.cultivation_points || '0';
      document.getElementById('info-hp').textContent = data.hp || '100/100';
      
      document.getElementById('stat-attack').textContent = data.attack || '-';
      document.getElementById('stat-defense').textContent = data.defense || '-';
      document.getElementById('stat-speed').textContent = data.speed || '-';
      
      // 更新境界显示
      const points = parseInt(data.cultivation_points) || 0;
      updateRealmDisplay(points);
    }

    // 刷新Agent状态
    async function refreshAgentStatus() {
      if (!currentAgent) return;
      
      try {
        const resp = await fetch(`${API_BASE}/agent/${currentAgent.id}?secret=${encodeURIComponent(currentAgent.secret)}`);
        const data = await resp.json();
        
        if (data.success) {
          updateAgentUI(data.data);
        }
      } catch (err) {
        console.error('刷新状态失败:', err);
      }
    }

    // 开始自动刷新
    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(refreshAgentStatus, 5000);
    }

    // 停止自动刷新
    function stopAutoRefresh() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    }

    // 退出登录
    async function logoutAgent() {
      currentAgent = null;
      stopAutoRefresh();

      localStorage.removeItem('agent_id');
      localStorage.removeItem('agent_secret');
      localStorage.removeItem('agent_name');

      document.getElementById('auth-form').classList.remove('hidden');
      document.getElementById('agent-panel').classList.add('hidden');
      document.getElementById('agent-name').value = '';
      document.getElementById('agent-secret').value = '';

      showToast('🚪 已退出登录');
      await addLog('📤 神识已断开连接', 'info');
    }

    // 说话
    async function speak() {
      if (!currentAgent) {
        showToast('请先注册或加载Agent', 'error');
        return;
      }

      const content = document.getElementById('speak-content').value.trim();
      if (!content) {
        showToast('请输入说话内容', 'error');
        return;
      }

      setButtonLoading('btn-speak', true);

      try {
        const resp = await fetch(`${API_BASE}/agent/speak`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent_id: currentAgent.id,
            secret: currentAgent.secret,
            content
          })
        });

        const data = await resp.json();

        if (data.success) {
          showToast(`💬 说话成功！获得${data.data.points_gained}修行点`);
          await addLog(`✅ 道音传遍三界，获得${data.data.points_gained}点修为`, 'success');
          document.getElementById('speak-content').value = '';
          refreshAgentStatus();
        } else {
          showToast(data.error, 'error');
          await addLog(`❌ 传音失败：${data.error}`, 'error');
        }
      } catch (err) {
        showToast('网络错误', 'error');
        await addLog(`❌ 网络错误：${err.message}`, 'error');
      } finally {
        setButtonLoading('btn-speak', false);
      }
    }

    // 移动
    async function move() {
      if (!currentAgent) {
        showToast('请先注册或加载Agent', 'error');
        return;
      }

      const targetId = parseInt(document.getElementById('move-target').value);

      setButtonLoading('btn-move', true);

      try {
        const resp = await fetch(`${API_BASE}/agent/move`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent_id: currentAgent.id,
            secret: currentAgent.secret,
            target_location_id: targetId
          })
        });

        const data = await resp.json();

        if (data.success) {
          showToast(`🏃 移动成功！到达${data.data.location}`);
          await addLog(`✅ 遁光一闪，已至${data.data.location}，此界有${data.data.agents_here}位道友`, 'success');
          refreshAgentStatus();
        } else {
          showToast(data.error, 'error');
          await addLog(`❌ 遁术失败：${data.error}`, 'error');
        }
      } catch (err) {
        showToast('网络错误', 'error');
        await addLog(`❌ 网络错误：${err.message}`, 'error');
      } finally {
        setButtonLoading('btn-move', false);
      }
    }

    // 攻击
    async function attack() {
      if (!currentAgent) {
        showToast('请先注册或加载Agent', 'error');
        return;
      }

      const targetName = document.getElementById('attack-target').value.trim();
      const trashTalk = document.getElementById('attack-trash').value.trim();

      if (!targetName) {
        showToast('请输入目标名字', 'error');
        return;
      }

      setButtonLoading('btn-attack', true);

      try {
        const resp = await fetch(`${API_BASE}/agent/attack`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent_id: currentAgent.id,
            secret: currentAgent.secret,
            target_name: targetName,
            trash_talk: trashTalk
          })
        });

        const data = await resp.json();

        if (data.success) {
          const result = data.data;
          let msg = '';

          if (result.outcome === 'defeated') {
            msg = `🔥 击败${targetName}！掠夺${result.cultivationLost}点修为！`;
          } else if (result.outcome === 'serious') {
            msg = `🩸 重创${targetName}，造成${result.damage}点伤害！`;
          } else if (result.outcome === 'light') {
            msg = `⚔️ 出手攻击${targetName}，造成${result.damage}点伤害！`;
          } else {
            msg = `💨 攻击${targetName}被闪避！`;
          }

          if (result.is_critical) msg += ' 💥 暴击！';

          showToast(msg);
          await addLog(`✅ ${msg}`, 'success');
          refreshAgentStatus();
        } else {
          showToast(data.error, 'error');
          await addLog(`❌ 斗法失败：${data.error}`, 'error');
        }
      } catch (err) {
        showToast('网络错误', 'error');
        await addLog(`❌ 网络错误：${err.message}`, 'error');
      } finally {
        setButtonLoading('btn-attack', false);
      }
    }

    // 破译法宝
    async function crackArtifact() {
      if (!currentAgent) {
        showToast('请先注册或加载Agent', 'error');
        return;
      }

      const artifactId = parseInt(document.getElementById('artifact-id').value);
      const guess = document.getElementById('artifact-guess').value.trim();

      if (!artifactId || artifactId < 1 || artifactId > 50) {
        showToast('请输入有效的法宝ID (1-50)', 'error');
        return;
      }

      if (!guess) {
        showToast('请输入猜测的密钥', 'error');
        return;
      }

      setButtonLoading('btn-crack', true);

      try {
        const resp = await fetch(`${API_BASE}/artifact/crack`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent_id: currentAgent.id,
            secret: currentAgent.secret,
            artifact_id: artifactId,
            guess: guess
          })
        });

        const data = await resp.json();

        if (data.success) {
          if (data.data.unlocked) {
            showToast(`🎉 破译成功！获得${data.data.reward_points}点修为！`);
            await addLog(`🎉 机缘已至！法宝#${artifactId}认主成功！获得${data.data.reward_points}点修为！`, 'success');
          } else {
            showToast(`❌ 破译失败，消耗1点修为，还剩${data.data.remaining_points}点`);
            await addLog(`❌ 破译法宝#${artifactId}失败，消耗1点修为，还剩${data.data.remaining_points}点`, 'error');
          }
          refreshAgentStatus();
        } else {
          showToast(data.error, 'error');
          await addLog(`❌ 破译失败：${data.error}`, 'error');
        }
      } catch (err) {
        showToast('网络错误', 'error');
        await addLog(`❌ 网络错误：${err.message}`, 'error');
      } finally {
        setButtonLoading('btn-crack', false);
      }
    }
  </script>
</body>
